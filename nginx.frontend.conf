# magicmasala-frontend — nginx inside the container.
#
# Reproduces what the old box's `magicmasala` vhost did, minus TLS and minus the
# /api/ proxy:
#   - TLS is Traefik's job now
#   - /api/ is routed to the backend container by Traefik, by path prefix, so it
#     must NOT be handled here
#
# Copy to the repo root as nginx.frontend.conf.

server {
    # Unprivileged port. Traefik reaches this over the Coolify docker network.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images, served straight from disk exactly as the old box did.
    # On the old box this was:
    #   location /uploads/ { alias /var/www/Magicmasalabristol/backend/uploads/uploads/; }
    # where backend/uploads/uploads was itself a symlink to
    # /var/www/magic-masala-data/uploads. Here the real directory is bind-mounted,
    # so there is no symlink to dangle.
    location /uploads/ {
        alias /usr/share/nginx/uploads/;

        # Images are content-addressed by the upload timestamp in their filename,
        # so they are safe to cache hard.
        expires 30d;
        add_header Cache-Control "public, immutable";

        # A missing image should 404, not fall through to index.html.
        try_files $uri =404;
    }

    # Hashed CRA assets: safe to cache indefinitely.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy will not reach browsers that
    # already hold a copy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback. react-router handles /menu, /gallery and the rest client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening. Traefik adds its own headers; these are the app-level ones.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The old box's vhost had no client_max_body_size, so uploads went through the
    # API, not here. Nothing is POSTed to this container.
    client_max_body_size 1m;
}
